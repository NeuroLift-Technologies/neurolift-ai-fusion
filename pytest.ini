[pytest]
# Pytest configuration for NeuroLift Technologies Simulation Environment

# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts = 
    --verbose
    --tb=short
    --strict-markers
    --strict-config
    --durations=10
# Coverage is deliberately NOT in addopts. pytest-cov registers --cov, so an
# unconditional --cov here made every environment without pytest-cov fail before
# running a single test ("unrecognized arguments: --cov=src"). That broke the
# isolated optional-runtime environments documented in
# docs/agent-loop-model-adapter.md, which intentionally install only their own
# runtime plus pytest.
#
# CI and the clearance script therefore pass the coverage flags explicitly,
# following the same convention as scripts/run_clearance_tests.py level 2:
#   pytest --cov=src --cov-report=term-missing --cov-report=html:htmlcov \
#          --cov-report=xml --cov-fail-under=40
#
# NOTE: gate was 80 but was silently disabled (wrong section header [tool:pytest]).
# Current realistic coverage is ~43% (see clearance report). Gate set to 40 with
# omits for lazily-imported adapters and external clients; raise incrementally
# as those paths gain tests. The [coverage:*] sections below stay authoritative.

# Markers for test categorization
markers =
    unit: Unit tests for individual components
    integration: Integration tests for component interactions
    e2e: End-to-end tests for complete workflows
    slow: Tests that take longer to run
    fast: Tests that run quickly
    avatar: Tests specific to Avatar system
    aide: Tests specific to Aide system
    advocate: Tests specific to Advocate system
    simulation: Tests specific to simulation environment
    config: Tests for configuration loading and validation
    privacy: Tests for privacy and data handling
    performance: Performance and load tests
    neurodivergent: Tests that require neurodivergent perspective validation
    ai: Tests for the ML/AI model layer

# Minimum version
minversion = 7.0

# Test timeout (in seconds)

# Parallel execution
# Use: pytest -n auto for parallel execution
# Requires pytest-xdist

# Coverage configuration
[coverage:run]
source = src
omit = 
    */tests/*
    */test_*
    */__pycache__/*
    */venv/*
    */env/*
    setup.py
    # Lazily-imported adapters (require torch/transformers or external API) — not hard deps
    */transformer_policy.py
    */openai_compat.py
    # Legacy / non-canonical paths noted in docs/architecture.md
    */training_session.py
    */network_client.py
    # External-service clients (graceful degradation when Supabase unavailable)
    */supabase_client.py

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    if self.debug:
    if settings.DEBUG
    raise AssertionError
    raise NotImplementedError
    if 0:
    if __name__ == .__main__.:
    class .*\\bProtocol\\):
    @(abc\\.)?abstractmethod

[coverage:html]
directory = htmlcov
