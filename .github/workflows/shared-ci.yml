# Shared CI — runs Python lint, test, and security checks on every push and PR
# to main. Previously delegated to reusable workflows in .github-private
# (python-lint.yml, python-test.yml, security-scan.yml) that no longer exist
# there, which caused every run to fail with a "workflow file issue".
# This file defines the jobs locally using the same patterns already
# established in python-app.yml and pgsa-portability-gate.yml.
#
# See: .github/workflows/python-app.yml  (lint + test patterns)
# See: .github/workflows/pgsa-portability-gate.yml  (gitleaks scan pattern)

name: Shared CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  lint:
    name: Lint — Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8
          pip install -r requirements.txt

      - name: Lint — simulation engine (src/)
        run: |
          flake8 src/ --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 src/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Lint — backend (backend/app/)
        run: |
          flake8 backend/app/ --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 backend/app/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

  test:
    name: Test — Python
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r backend/requirements.txt

      - name: Run tests
        run: pytest --tb=short

  security:
    name: Security Scan — Secrets (Gitleaks)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip --upgrade pip
          pip install -r requirements.txt

      - name: Install Gitleaks
        run: |
          GITLEAKS_VERSION="8.21.2"
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Run secrets scan
        id: secrets_scan
        run: |
          python scripts/scan_secrets.py \
            --gitleaks-config .github/gitleaks.toml \
            --report-dir shared-ci-reports \
            --report-format markdown \
            --fail-on-findings \
            --skip-trufflehog \
            --verbose

      - name: Upload secrets scan report
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: shared-ci-secrets-report
          path: shared-ci-reports/
          retention-days: 30
