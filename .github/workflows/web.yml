name: Web — Build & Type Check

on:
  push:
    branches: ["main"]
    paths:
      - "apps/web/**"
      - "package.json"
      - "turbo.json"
  pull_request:
    branches: ["main"]
    paths:
      - "apps/web/**"
      - "package.json"
      - "turbo.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # --prefix . installs apps/web on its own, from apps/web/package-lock.json, rather than
      # resolving the whole npm workspace (apps/mobile included). Vercel installs the same way
      # (apps/web/vercel.json).
      - name: Install dependencies
        run: npm install --prefix .

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint -- --max-warnings=0

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
