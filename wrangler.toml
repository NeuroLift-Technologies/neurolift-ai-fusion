# Root Wrangler config aligned to the active World Engine Worker implementation.
# Canonical deploy workflow remains in cloudflare-engine/.

name = "neurolift-ai-fusion"
main = "src/index.ts"
compatibility_date = "2026-05-01"
workers_dev = true

[durable_objects]
bindings = [
	{ name = "WORLD_ENGINE", class_name = "WorldEngineDO" }
]

# NOTE: The v1 Durable Object migration (new_sqlite_classes = ["WorldEngineDO"])
# was already applied. Cloudflare Workers Builds deploys via `wrangler versions
# upload`, which rejects migrations in versioned uploads (code 10211). The block
# is intentionally omitted so versioned uploads succeed. Re-add it only for a
# one-time `wrangler deploy` when introducing a new migration tag.
